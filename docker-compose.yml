services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      PREVIEW_MAX_EDGE: "1600"
      MAX_MEGAPIXELS: "40"
      CACHE_MAX_BYTES: "1500000000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
